name: foundation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.5"
      - run: uv sync --locked
      - run: uv run --locked python tools/install_cosign.py
      - run: uv run --locked python tools/release_conformance.py fetch
        env:
          GH_TOKEN: ${{ github.token }}
      - run: uv run --locked python tools/workflow_assets.py install
      - run: uv sync --locked --extra conformance
      - run: uv run --locked --extra conformance python tools/verify.py full
      - run: uv run --locked python -m kryvola_platform config/foundation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-network-observations
          path: |
            build/integration/*/network-report.json
            build/integration/*/network-observations.jsonl
            build/integration/*/fake-workflow-report.json
            build/integration/*/release-conformance-report.json
            build/integration/*/isolation-report.json
            build/campaigns/*/summary.json
            build/m0/*/lock.json
            build/m0/*/report.json
            build/m0/*/manifest.json
          if-no-files-found: ignore
          retention-days: 7
