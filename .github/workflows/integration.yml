name: foundation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.5"
      - run: uv sync --locked
      - run: uv run --locked python tools/install_cosign.py
      - run: uv run --locked python tools/release_conformance.py fetch
        env:
          GH_TOKEN: ${{ github.token }}
      - run: uv run --locked python tools/workflow_assets.py install
      - run: uv sync --locked --extra conformance
      - run: uv run --locked --extra conformance python tools/verify.py full
        env:
          KRYVOLA_M1_SEPARATE_JOB: "1"
      - run: uv run --locked python -m kryvola_platform config/foundation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-network-observations
          path: |
            build/integration/*/network-report.json
            build/integration/*/network-observations.jsonl
            build/integration/*/fake-workflow-report.json
            build/integration/*/release-conformance-report.json
            build/integration/*/isolation-report.json
            build/campaigns/*/summary.json
            build/m0/*/lock.json
            build/m0/*/report.json
            build/m0/*/manifest.json
          if-no-files-found: ignore
          retention-days: 7

  m1:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.5"
      - run: uv sync --locked
      - run: uv run --locked python tools/install_release.py
      - run: uv run --locked python tools/m1.py install
      - run: uv run --locked python -m unittest discover -s tests -p live_m1_identity.py -v
      - run: uv run --locked python tools/m1.py ci
      - run: uv run --locked python -m unittest discover -s tests -p live_m1_inference.py -v
      - run: uv run --locked python tools/m1_isolation_local.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m1-public-startup-observations
          path: |
            build/m1-report.json
            build/m1-inference-report.json
            build/m1-local-isolation.json
          if-no-files-found: ignore
          retention-days: 7

  m1-boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.5"
      - run: uv sync --locked
      - run: uv run --locked python tools/m1_preproduction.py check
      - run: uv run --locked python tools/m1_cluster.py install
      - run: uv run --locked python tools/m1_cluster.py ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m1-public-admission-observations
          path: build/m1-admission-report.json
          if-no-files-found: ignore
          retention-days: 7


  m1-worker-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.5"
      - run: uv sync --locked
      - run: uv run --locked python tools/install_release.py
      - run: uv run --locked python tools/m1.py install
      - run: uv run --locked python tools/m1_cluster.py install
      - run: uv run --locked python tools/m1_live_infra.py
      - run: uv run --locked python tools/m1_isolation_cluster.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m1-public-worker-isolation
          path: build/m1-cluster-isolation.json
          if-no-files-found: ignore
          retention-days: 7

  m1-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        group: [notifications, dispatch, durability, artifacts]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.5"
      - run: uv sync --locked
      - run: uv run --locked python tools/install_release.py
      - run: uv run --locked python tools/m1.py install
      - run: uv run --locked python -m unittest discover -s tests -p live_m1_recovery.py -v
        env:
          KRYVOLA_M1_RECOVERY_GROUP: ${{ matrix.group }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m1-recovery-${{ matrix.group }}
          path: build/m1-recovery-report.json
          if-no-files-found: error
          retention-days: 7

  m1-recovery-verify:
    needs: m1-recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.5"
      - run: uv sync --locked
      - uses: actions/download-artifact@v8
        with:
          pattern: m1-recovery-*
          path: build/m1-recovery-segments
      - run: uv run --locked python tools/m1_recovery.py --verify-segments build/m1-recovery-segments > build/m1-recovery-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: m1-complete-recovery-report
          path: build/m1-recovery-report.json
          retention-days: 7
