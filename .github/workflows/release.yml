name: experimental-platform-release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: experimental-platform-release
  cancel-in-progress: false
jobs:
  qualify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.5"
      - run: uv sync --locked
      - run: uv run --locked python tools/install_release.py
      - run: uv run --locked python tools/install_cosign.py
      - run: uv run --locked python tools/release_conformance.py fetch
        env:
          GH_TOKEN: ${{ github.token }}
      - run: uv run --locked python tools/workflow_assets.py install
      - run: uv sync --locked --extra conformance
      - run: uv run --locked --extra conformance python tools/verify.py full
      - run: uv run --locked python tools/release.py qualify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: experimental-wheel
          path: build/publication/*
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: qualify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.5"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: experimental-wheel
          path: build/publication
      - run: uv run --locked python tools/install_release.py
      - name: Sign and verify exact publisher identity and commit
        run: |
          build/release-tools/cosign sign-blob --yes --bundle build/publication/manifest.sigstore.json build/publication/manifest.json
          uv run --locked python tools/release.py verify --source "$GITHUB_SHA"
      - name: Create a fresh draft, upload once, then expose the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="experimental-${GITHUB_SHA}"
          existing="$(git ls-remote --tags origin "refs/tags/$tag")"
          if [ -n "$existing" ]; then echo 'Tag exists; refusing replacement'; exit 1; fi
          if gh release view "$tag"; then echo 'Release exists; refusing replacement'; exit 1; fi
          gh release create "$tag" --target "$GITHUB_SHA" --draft --prerelease --title "$tag" --notes 'Experimental platform driver package only; no production execution or security qualification.' build/publication/kryvola_platform-*.whl build/publication/driver.tar build/publication/LICENSE build/publication/uv.lock build/publication/sbom.spdx.json build/publication/provenance.json build/publication/manifest.json build/publication/manifest.sigstore.json
          gh release edit "$tag" --draft=false
