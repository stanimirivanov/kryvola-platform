name: foundation
on:
  pull_request:
  push:
    branches: [main, 'feature/issue-*', 'fix/issue-*']
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.5"
      - run: uv sync --locked
      - run: uv run --locked python tools/install_cosign.py
      - run: uv run --locked python tools/verify.py full
      - run: uv run --locked python -m kryvola_platform config/foundation.json
